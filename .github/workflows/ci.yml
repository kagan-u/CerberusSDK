name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs
      - run: cargo fmt --manifest-path rs/Cargo.toml -- --check
      - run: cargo clippy --manifest-path rs/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rs/Cargo.toml
